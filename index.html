<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEIMEI INSPIRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #111;
            --text-light: #999;
            --bg-main: #FAFAFA;
            --border-color: #E2E2E2;
            --left-sidebar-width: 260px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; background-color: var(--bg-main); color: var(--text-main); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        button { background: none; border: none; cursor: pointer; font-family: inherit; }
        
        .top-header { position: sticky; top: 0; width: 100%; height: 80px; background-color: rgba(250,250,250,0.95); backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: center; padding: 0 3rem; z-index: 150; border-bottom: 1px solid var(--border-color); }
        .logo { position: absolute; left: 50%; transform: translateX(-50%); font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .header-btn { font-size: 1.2rem; font-weight: 400; display: flex; align-items: center; transition: color 0.3s; }
        .header-btn:hover { color: var(--text-light); }
        .filter-btn { font-size: 0.8rem; letter-spacing: 0.15em; font-weight: 500;}

        .layout-container { display: flex; min-height: calc(100vh - 80px); position: relative; }
        .left-sidebar { position: fixed; top: 80px; left: 0; width: var(--left-sidebar-width); height: calc(100vh - 80px); padding: 4rem 3rem; background-color: var(--bg-main); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); transform: translateX(0); z-index: 100; }
        .left-sidebar.hidden { transform: translateX(-100%); }
        .category-nav { display: flex; flex-direction: column; gap: 2rem; align-items: flex-start; }
        .category-nav button { font-size: 0.9rem; letter-spacing: 0.15em; color: var(--text-light); text-transform: uppercase; transition: all 0.3s ease; position: relative; }
        .category-nav button:hover, .category-nav button.active { color: var(--text-main); font-weight: 500; }
        .category-nav button.active::before { content: ''; position: absolute; left: -15px; top: 50%; transform: translateY(-50%); width: 8px; height: 1px; background-color: var(--text-main); }

        .sub-menu { display: flex; flex-direction: column; gap: 1.2rem; margin-left: 18px; display: none; }
        .sub-menu.show { display: flex; }
        .sub-menu button { font-size: 0.8rem; }

        .main-content { margin-left: var(--left-sidebar-width); padding: 4rem 3rem; width: calc(100% - var(--left-sidebar-width)); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .main-content.expanded { margin-left: 0; width: 100%; }
        .masonry-grid { column-count: 3; column-gap: 3rem; }
        @media (max-width: 1200px) { .masonry-grid { column-count: 2; column-gap: 2rem;} }
        @media (max-width: 768px) { 
            .top-header { padding: 0 1.5rem; } 
            .logo { font-size: 1.5rem; } 
            .masonry-grid { column-count: 1; } 
            .left-sidebar { transform: translateX(-100%); } 
            .main-content { margin-left: 0; width: 100%; padding: 2rem 1.5rem; } 
        }

        .item { break-inside: avoid; margin-bottom: 3rem; position: relative; cursor: zoom-in; }
        .item img, .item video { width: 100%; display: block; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .item:hover img, .item:hover video { transform: scale(1.03); }

        .right-filter { position: fixed; top: 0; right: 0; width: 400px; height: 100vh; background-color: #fff; z-index: 200; padding: 3rem 2.5rem; box-shadow: -10px 0 40px rgba(0,0,0,0.05); transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .right-filter.active { transform: translateX(0); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;}
        .drawer-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
        .drawer-close { font-size: 2.2rem; font-weight: 300; }
        .tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .tags button { border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 0.05em; transition: all 0.2s; }
        .tags button:hover, .tags button.active { background-color: var(--text-main); color: white; border-color: var(--text-main); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 190; display: none; opacity: 0; transition: opacity 0.4s; }
        .overlay.active { display: block; opacity: 1; }

        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,1); z-index: 1000; display: flex; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-close { position: absolute; top: 1.5rem; right: 3rem; font-size: 3.5rem; font-weight: 300; cursor: pointer; z-index: 10; color: #333; }
        .lightbox-wrapper { display: flex; width: 100%; height: 100%; }
        .lightbox-image-box { flex: 6; background-color: #F5F5F5; display: flex; justify-content: center; align-items: center; padding: 4rem; overflow: hidden;}
        .lightbox-image-box img, .lightbox-image-box video { max-width: 100%; max-height: 90vh; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .lightbox-text-box { flex: 4; background-color: #fff; padding: 5rem 4rem; overflow-y: auto; text-align: left; border-left: 1px solid var(--border-color); }
        .detail-title { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 2rem; font-weight: 700;}
        .detail-row { margin-bottom: 1.8rem; }
        .detail-label { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.4rem; display: block; }
        .detail-content { font-size: 1rem; color: #555; line-height: 1.7; word-break: break-all; }
        .detail-tags-title { margin-top: 3rem; border-top: 1px solid var(--border-color); padding-top: 2rem; font-family: 'Playfair Display', serif; font-size: 1.2rem;}
        .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
        .detail-tags span { background: #f0f0f0; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; color: #333; }

        @media (max-width: 900px) { 
            .lightbox-wrapper { flex-direction: column; }
            .lightbox-image-box { flex: none; height: 50vh; padding: 2rem; padding-top: 4rem;}
            .lightbox-text-box { flex: none; padding: 2rem; border-left: none; }
            .lightbox-close { right: 1.5rem; top: 0.5rem; font-size: 2.5rem;}
        }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="header-btn" id="toggleLeftBtn">☰</button>
        <div class="logo">MEIMEI INSPIRATION</div>
        <button class="header-btn filter-btn" id="openFilterBtn">FILTERS ＋</button>
    </header>

    <div class="layout-container">
        <aside class="left-sidebar" id="leftSidebar">
            <nav class="category-nav">
                <button class="cat-btn active" data-cat="all">ALL</button>

                <button class="cat-btn parent-btn" data-parent="lookbook">LOOKBOOK</button>
                <div class="sub-menu" id="lookbook-sub">
                    <button class="cat-btn sub-btn" data-cat="look1">LOOK 1</button>
                    <button class="cat-btn sub-btn" data-cat="look2">LOOK 2</button>
                    <button class="cat-btn sub-btn" data-cat="look3">LOOK 3</button>
                    <button class="cat-btn sub-btn" data-cat="look4">LOOK 4</button>
                    <button class="cat-btn sub-btn" data-cat="look5">LOOK 5</button>
                    <button class="cat-btn sub-btn" data-cat="look6">LOOK 6</button>
                    <button class="cat-btn sub-btn" data-cat="look7">LOOK 7</button>
                </div>

                <button class="cat-btn parent-btn" data-parent="redcarpet">RED CARPET</button>
                <div class="sub-menu" id="redcarpet-sub">
                    <button class="cat-btn sub-btn" data-cat="zendaya">ZENDAYA</button>
                </div>

                <button class="cat-btn parent-btn" data-parent="aesthetic">AESTHETIC</button>
                <div class="sub-menu" id="aesthetic-sub">
                    <button class="cat-btn sub-btn" data-cat="floral">FLORAL</button>
                </div>

                <button class="cat-btn" data-cat="photo">PHOTO</button>
            </nav>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="masonry-grid" id="grid"></div>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>

    <aside class="right-filter" id="rightFilter">
        <div class="drawer-header">
            <h2 class="drawer-title">Keywords Filter</h2>
            <button class="drawer-close" id="closeFilterBtn">×</button>
        </div>
        <div class="tags" id="tagsContainer"></div>
    </aside>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="closeLightbox">×</span>
        <div class="lightbox-wrapper">
            <div class="lightbox-image-box" id="lbMediaBox"></div>
            <div class="lightbox-text-box" id="lightboxText"></div>
        </div>
    </div>

<script>
const inspirationData = [
    {
        id: 'look1-1',
        type: 'look1',
        tags: ['Look1'],
        url: 'look101.mp4',
        inspirationBits: '~',
        referenceLink: 'http://xhslink.cn/o/89xbyXAT1Nt 把文本复制下来，打开【小红书】即可查看。'
    },
    {
        id: 'look1-2',
        type: 'look1',
        tags: ['Look1'],
        url: 'look102.jpeg',
        inspirationBits: '造型灵感',
        referenceLink: '纯白仙女｜Marchesa 2010秋冬🦢 Marchesa 2010秋冬系... http://xhslink.cn/o/4oMMWQljGtR 复制后直奔【小红书】，笔记等你来翻~'
    },
    {
        id: 'look2-1',
        type: 'look2',
        tags: ['Look2'],
        url: 'look201.mp4',
        inspirationBits: '~',
        referenceLink: '1.02 复制打开抖音，看看【香辣蟑螂干的作品】被人夸的感觉真好！ 漂亮裙子能够改变打工人一天的心... https://v.douyin.com/_KZc5JAK538/ KJI:/ :3pm S@L.jC 02/27'
    },
    {
        id: 'look2-2',
        type: 'look2',
        tags: ['Look2'],
        url: 'look202.jpeg',
        inspirationBits: '妆容灵感',
        referenceLink: 'Hot Summerrr🍧 棉花糖系妆容 是真的吗？ http://xhslink.cn/o/9u21D8xHVt4 存下链接，去【小红书】阅读全文~'
    },
    {
        id: 'floral-1',
        type: 'floral',
        tags: ['Floral'],
        url: 'floral1.mp4',
        inspirationBits: '花环样式',
        referenceLink: '2.33 复制打开抖音，看看【6ghost的图文作品】一秒钟的瞬间  https://v.douyin.com/UZg1-U6vCeU/ 07/16 QKW:/ :9pm w@f.Ox'
    },
    {
        id: 'floral-2',
        type: 'floral',
        tags: ['Floral'],
        url: 'floral2.mp4',
        inspirationBits: '鲜花发饰',
        referenceLink: 'Some videos from my work 👼🏻 http://xhslink.cn/o/50IW17fFRKu 内容复制后，前往【小红书】直接打开笔记。'
    },
    {
        id: 'photo-1',
        type: 'photo',
        tags: ['Photo'],
        url: 'photo1.png',
        inspirationBits: '拍照构图灵感\nBGM配乐，极为重要',
        referenceLink: '2.30 复制打开抖音，看看【伤心网友小王的图文作品】触不可及刚刚好 日久天长惹人恼  https://v.douyin.com/kuQ3i_4U50o/ O@X.ZZ VlP:/ 12/25 :5pm'
    },
    {
        id: 'photo-2',
        type: 'photo',
        tags: ['Photo'],
        url: 'photo2.png',
        inspirationBits: '~',
        referenceLink: '7.48 复制打开抖音，看看【Ivyyy.的图文作品】想在你身边  https://v.douyin.com/3pD4jpZGWW4/ 09/16 :1pm X@z.gb yte:/'
    },
    {
        id: 'zendaya-1',
        type: 'zendaya',
        tags: ['Zendaya'],
        url: 'Zendayalook1',
        inspirationBits: '造型灵感、妆容灵感、表情管理',
        referenceLink: '赞达亚最美的造型永远是下一套🪽✨ 昨天出席《奥德赛... http://xhslink.cn/o/5UwiXa1QH57 存好这段，去【小红书】逛逛笔记~'
    }
];

const grid = document.getElementById('grid');
const tagsContainer = document.getElementById('tagsContainer');
const allCatBtns = document.querySelectorAll('.cat-btn');
const parentBtns = document.querySelectorAll('.parent-btn');
const toggleLeftBtn = document.getElementById('toggleLeftBtn');
const leftSidebar = document.getElementById('leftSidebar');
const mainContent = document.getElementById('mainContent');
const rightFilter = document.getElementById('rightFilter');
const overlay = document.getElementById('overlay');
const lookbookSub = document.getElementById('lookbook-sub');
const aestheticSub = document.getElementById('aesthetic-sub');
const redcarpetSub = document.getElementById('redcarpet-sub');
const lightbox = document.getElementById('lightbox');
const lbMediaBox = document.getElementById('lbMediaBox');
const lightboxText = document.getElementById('lightboxText');

let currentCategory = 'all';
let currentTag = '';
const allTags = [...new Set(inspirationData.flatMap(item => item.tags))];

toggleLeftBtn.addEventListener('click', () => {
    if (window.innerWidth <= 768) {
        leftSidebar.style.transform = leftSidebar.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
    } else {
        leftSidebar.classList.toggle('hidden');
        mainContent.classList.toggle('expanded');
    }
});

parentBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        lookbookSub.classList.remove('show');
        aestheticSub.classList.remove('show');
        redcarpetSub.classList.remove('show');
        const p = btn.dataset.parent;
        if(p === 'lookbook') lookbookSub.classList.add('show');
        if(p === 'aesthetic') aestheticSub.classList.add('show');
        if(p === 'redcarpet') redcarpetSub.classList.add('show');
    })
})

allCatBtns.forEach(btn => {
    btn.addEventListener('click', e => {
        allCatBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.cat;
        currentTag = '';
        document.querySelectorAll('.tags button').forEach(b => b.classList.remove('active'));
        renderGrid();
    })
})

function renderGrid() {
    grid.innerHTML = '';
    const filterList = inspirationData.filter(item => {
        const catOk = currentCategory === 'all' || item.type === currentCategory;
        const tagOk = currentTag === '' || item.tags.includes(currentTag);
        return catOk && tagOk;
    })
    filterList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        if(item.url.endsWith('.mp4')){
            div.innerHTML = `<video muted preload="metadata" style="width:100%;display:block;" src="${item.url}" controls></video>`
        }else{
            div.innerHTML = `<img loading="lazy" style="width:100%;display:block;" src="${item.url}">`
        }
        div.onclick = () => openLightbox(item);
        grid.appendChild(div);
    })
}

function renderTags() {
    tagsContainer.innerHTML = '';
    allTags.forEach(tag => {
        const btn = document.createElement('button');
        btn.innerText = tag;
        btn.onclick = () => {
            currentTag = currentTag === tag ? '' : tag;
            renderTags();
            renderGrid();
        }
        if(currentTag === tag) btn.classList.add('active');
        tagsContainer.appendChild(btn);
    })
}

function toggleFilterDrawer(show) {
    if(show){
        rightFilter.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }else{
        rightFilter.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }
}
document.getElementById('openFilterBtn').onclick = ()=>toggleFilterDrawer(true);
document.getElementById('closeFilterBtn').onclick = ()=>toggleFilterDrawer(false);
overlay.onclick = ()=>toggleFilterDrawer(false);

function openLightbox(item) {
    lbMediaBox.innerHTML = '';
    if(item.url.endsWith('.mp4')){
        lbMediaBox.innerHTML = `<video controls style="max-width:100%;max-height:90vh;" src="${item.url}"></video>`
    }else{
        lbMediaBox.innerHTML = `<img style="max-width:100%;max-height:90vh;" src="${item.url}">`
    }
    lightboxText.innerHTML = `
        <div class="detail-row">
            <span class="detail-label">Inspiration Bits</span>
            <div class="detail-content">${item.inspirationBits.replaceAll('\n','<br>')}</div>
        </div>
        <div class="detail-row">
            <span class="detail-label">Reference Link</span>
            <div class="detail-content">${item.referenceLink}</div>
        </div>
    `;
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
}
document.getElementById('closeLightbox').onclick = ()=>{
    lightbox.classList.remove('active');
    lbMediaBox.innerHTML = '';
    lightboxText.innerHTML = '';
    document.body.style.overflow = '';
}

renderTags();
renderGrid();
</script>
</body>
</html>
