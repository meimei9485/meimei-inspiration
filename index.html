<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEIMEI INSPIRATION</title>
    <!-- 引入高雅字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #111;
            --text-light: #999;
            --bg-main: #FAFAFA;
            --border-color: #E2E2E2;
            --left-sidebar-width: 260px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; background-color: var(--bg-main); color: var(--text-main); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        button { background: none; border: none; cursor: pointer; font-family: inherit; }
        
        /* 顶部导航 */
        .top-header { position: sticky; top: 0; width: 100%; height: 80px; background-color: rgba(250, 250, 250, 0.95); backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: center; padding: 0 3rem; z-index: 150; border-bottom: 1px solid var(--border-color); }
        .logo { position: absolute; left: 50%; transform: translateX(-50%); font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .header-btn { font-size: 1.2rem; font-weight: 400; display: flex; align-items: center; transition: color 0.3s; }
        .header-btn:hover { color: var(--text-light); }
        .filter-btn { font-size: 0.8rem; letter-spacing: 0.15em; font-weight: 500;}

        /* 页面布局 */
        .layout-container { display: flex; min-height: calc(100vh - 80px); position: relative; }

        /* 左侧菜单 */
        .left-sidebar { position: fixed; top: 80px; left: 0; width: var(--left-sidebar-width); height: calc(100vh - 80px); padding: 4rem 3rem; background-color: var(--bg-main); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); transform: translateX(0); z-index: 100; }
        .left-sidebar.hidden { transform: translateX(-100%); }
        .category-nav { display: flex; flex-direction: column; gap: 2rem; align-items: flex-start; }
        .category-nav button { font-size: 0.9rem; letter-spacing: 0.15em; color: var(--text-light); text-transform: uppercase; transition: all 0.3s ease; position: relative; }
        .category-nav button:hover, .category-nav button.active { color: var(--text-main); font-weight: 500; }
        .category-nav button.active::before { content: ''; position: absolute; left: -15px; top: 50%; transform: translateY(-50%); width: 8px; height: 1px; background-color: var(--text-main); }

        /* 中间主视区 */
        .main-content { margin-left: var(--left-sidebar-width); padding: 4rem 3rem; width: calc(100% - var(--left-sidebar-width)); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .main-content.expanded { margin-left: 0; width: 100%; }
        .masonry-grid { column-count: 3; column-gap: 3rem; }
        @media (max-width: 1200px) { .masonry-grid { column-count: 2; column-gap: 2rem;} }
        @media (max-width: 768px) { .top-header { padding: 0 1.5rem; } .logo { font-size: 1.5rem; } .masonry-grid { column-count: 1; } .left-sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; width: 100%; padding: 2rem 1.5rem; } .main-content.expanded { margin-left: auto; } }

        .item { break-inside: avoid; margin-bottom: 3rem; position: relative; cursor: zoom-in; }
        .item img { width: 100%; display: block; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .item:hover img { transform: scale(1.03); }

        /* 右侧过滤器抽屉 */
        .right-filter { position: fixed; top: 0; right: 0; width: 400px; height: 100vh; background-color: #fff; z-index: 200; padding: 3rem 2.5rem; box-shadow: -10px 0 40px rgba(0,0,0,0.05); transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; }
        .right-filter.active { transform: translateX(0); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;}
        .drawer-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
        .drawer-close { font-size: 2.2rem; font-weight: 300; }
        .tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .tags button { border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 20px; font-size: 0.8rem; letter-spacing: 0.05em; transition: all 0.2s; }
        .tags button:hover, .tags button.active { background-color: var(--text-main); color: white; border-color: var(--text-main); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 190; display: none; opacity: 0; transition: opacity 0.4s; }
        .overlay.active { display: block; opacity: 1; }

        /* --- 🎨全新升级的详情分析弹出页 --- */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,1); z-index: 1000; display: flex; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-close { position: absolute; top: 1.5rem; right: 3rem; font-size: 3.5rem; font-weight: 300; cursor: pointer; z-index: 10; color: #333; }
        
        /* 左右分屏容器 */
        .lightbox-wrapper { display: flex; width: 100%; height: 100%; }
        
        /* 左侧放高清大图 */
        .lightbox-image-box { flex: 6; background-color: #F5F5F5; display: flex; justify-content: center; align-items: center; padding: 4rem; overflow: hidden;}
        .lightbox-image-box img { max-width: 100%; max-height: 90vh; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        /* 右侧放文字分析 */
        .lightbox-text-box { flex: 4; background-color: #fff; padding: 5rem 4rem; overflow-y: auto; text-align: left; border-left: 1px solid var(--border-color); }
        
        /* 文字排版样式定制 */
        .detail-title { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 2rem; font-weight: 700;}
        .detail-topic { font-weight: 600; font-size: 1.1rem; margin-top: 2rem; margin-bottom: 0.5rem; display: flex; align-items: center;}
        .detail-topic::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: #000; border-radius: 50%; margin-right: 10px;}
        .detail-desc { font-size: 1rem; color: #555; line-height: 1.8; margin-bottom: 1.5rem; }
        .detail-tags-title { margin-top: 3rem; border-top: 1px solid var(--border-color); padding-top: 2rem; font-family: 'Playfair Display', serif; font-size: 1.2rem;}
        .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }
        .detail-tags span { background: #f0f0f0; padding: 5px 12px; border-radius: 4px; font-size: 0.85rem; color: #333; }

        /* 手机端改成上下排版 */
        @media (max-width: 900px) { 
            .lightbox-wrapper { flex-direction: column; }
            .lightbox-image-box { flex: none; height: 50vh; padding: 2rem; padding-top: 4rem;}
            .lightbox-text-box { flex: none; padding: 2rem; border-left: none; }
            .lightbox-close { right: 1.5rem; top: 0.5rem; font-size: 2.5rem;}
        }
    </style>
</head>
<body>
    <header class="top-header">
        <button class="header-btn" id="toggleLeftBtn">☰</button>
        <div class="logo">MEIMEI INSPIRATION</div>
        <button class="header-btn filter-btn" id="openFilterBtn">FILTERS ＋</button>
    </header>

    <div class="layout-container">
        <aside class="left-sidebar" id="leftSidebar">
            <nav class="category-nav">
                <button class="cat-btn active" data-cat="all">ALL</button>
                <button class="cat-btn" data-cat="picture">PICTURES</button>
                <!-- 迪士尼公主风导航按钮 -->
                <button class="cat-btn" data-cat="disney-princess">DISNEY PRINCESS STYLE</button>
            </nav>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="masonry-grid" id="grid"></div>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>

    <aside class="right-filter" id="rightFilter">
        <div class="drawer-header">
            <h2 class="drawer-title">Keywords Filter</h2>
            <button class="drawer-close" id="closeFilterBtn">×</button>
        </div>
        <div class="tags" id="tagsContainer"></div>
    </aside>

    <!-- 🎨全新分析详情展示层 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="closeLightbox">×</span>
        <div class="lightbox-wrapper">
            <div class="lightbox-image-box">
                <img src="" alt="View" id="lightboxImg">
            </div>
            <!-- 文字渲染区域 -->
            <div class="lightbox-text-box" id="lightboxText">
            </div>
        </div>
    </div>

<script>
    // === 核心数据区：仅保留可用的迪士尼公主素材，删除全部失效pic1-pic8 ===
    const inspirationData = [
        {
            id: 'princess1',
            type: 'disney-princess',
            tags: ['Disney Princess', 'Princess Makeup', 'Pink Aesthetic', 'Lolita'],
            url: 'makeup.jpeg',
            title: 'Princess Romantic Makeup',
            details: [
                { title: '风格主题', desc: '迪士尼公主温柔甜妆，粉调腮红+大朵玫瑰发饰，复古柔焦少女氛围感。' },
                { title: '适用场景', desc: '公主风钻石画、洛丽塔穿搭参考、少女手作灵感。' }
            ]
        },
        {
            id: 'princess2',
            type: 'disney-princess',
            tags: ['Disney Princess', 'Princess Dress', 'Pink Gown', 'Vintage'],
            url: 'dress.mp4',
            title: 'Vintage Princess Dress Display',
            details: [
                { title: '风格主题', desc: '复古粉白泡泡袖公主礼裙，褶皱蕾丝设计，经典迪士尼公主裙版型参考。' },
                { title: '适用场景', desc: '服装钻石画、布艺手工、少女软装设计素材。' }
            ]
        },
        {
            id: 'princess3',
            type: 'disney-princess',
            tags: ['Disney Princess', 'Princess Hairstyle', 'Floral Hair', 'Cute'],
            url: 'hairstyle.mp4',
            title: 'Floral Princess Hairstyle',
            details: [
                { title: '风格主题', desc: '温柔大波浪鲜花公主发型，浅棕渐变发色，田园童话公主造型。' },
                { title: '适用场景', desc: '人物钻石画发型参考、少女妆造手作灵感。' }
            ]
        }
    ];

    const grid = document.getElementById('grid');
    const tagsContainer = document.getElementById('tagsContainer');
    const catBtns = document.querySelectorAll('.cat-btn');
    const toggleLeftBtn = document.getElementById('toggleLeftBtn');
    const leftSidebar = document.getElementById('leftSidebar');
    const mainContent = document.getElementById('mainContent');
    const rightFilter = document.getElementById('rightFilter');
    const overlay = document.getElementById('overlay');

    let currentCategory = 'all';
    let currentTag = '';
    const allTags = [...new Set(inspirationData.flatMap(item => item.tags))];

    toggleLeftBtn.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            leftSidebar.style.transform = leftSidebar.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
        } else {
            leftSidebar.classList.toggle('hidden');
            mainContent.classList.toggle('expanded');
        }
    });

    // 网格渲染：兼容图片+视频
    function renderGrid() {
        grid.innerHTML = '';
        let filteredData = inspirationData.filter(item => {
            const matchCategory = currentCategory === 'all' || item.type === currentCategory;
            const matchTag = currentTag === '' || item.tags.includes(currentTag);
            return matchCategory && matchTag;
        });

        filteredData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.dataset.type = item.type;
            if(item.url.endsWith('.mp4')){
                div.innerHTML = `
                <video style="width:100%;display:block;object-fit:cover;" loading="lazy" muted preload="metadata">
                    <source src="${item.url}" type="video/mp4">
                </video>`;
            }else{
                div.innerHTML = `<img src="${item.url}" loading="lazy" alt="Art Image" style="width:100%;display:block;">`;
            }
            div.addEventListener('click', () => openLightbox(item));
            grid.appendChild(div);
        });
    }

    // 筛选标签渲染
    function renderTags() {
        tagsContainer.innerHTML = '';
        allTags.forEach(tag => {
            const btn = document.createElement('button');
            btn.textContent = tag;
            btn.onclick = () => {
                if(currentTag === tag) {
                    currentTag = ''; btn.classList.remove('active');
                } else {
                    currentTag = tag;
                    document.querySelectorAll('.tags button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
                renderGrid();
            };
            tagsContainer.appendChild(btn);
        });
    }

    // 左侧分类按钮点击筛选
    catBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            catBtns.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.dataset.cat;
            currentTag = '';
            document.querySelectorAll('.tags button').forEach(b => b.classList.remove('active'));
            renderGrid();
        });
    });

    // 右侧筛选抽屉开关
    function toggleFilterDrawer(show) {
        if(show) { rightFilter.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; } 
        else { rightFilter.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = 'auto'; }
    }
    document.getElementById('openFilterBtn').onclick = () => toggleFilterDrawer(true);
    document.getElementById('closeFilterBtn').onclick = () => toggleFilterDrawer(false);
    overlay.onclick = () => toggleFilterDrawer(false);

    // 弹窗大图/视频预览逻辑
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxText = document.getElementById('lightboxText');

    function openLightbox(itemData) {
        const mediaBox = document.querySelector('.lightbox-image-box');
        mediaBox.innerHTML = '';
        if(itemData.url.endsWith('.mp4')){
            mediaBox.innerHTML = `
            <video id="lightboxMedia" style="max-width:100%;max-height:90vh;box-shadow:0 10px 40px rgba(0,0,0,0.1);" controls>
                <source src="${itemData.url}" type="video/mp4">
            </video>`;
        }else{
            mediaBox.innerHTML = `<img src="${itemData.url}" alt="View" id="lightboxImg" style="max-width:100%;max-height:90vh;box-shadow:0 10px 40px rgba(0,0,0,0.1);">`;
        }

        let contentHTML = '';
        if (itemData.details) {
            contentHTML += `<h2 class="detail-title">${itemData.title || 'Inspiration Details'}</h2>`;
            itemData.details.forEach(detail => {
                contentHTML += `
                    <div class="detail-topic">${detail.title}</div>
                    <div class="detail-desc">${detail.desc}</div>
                `;
            });
        } else {
            contentHTML += `<h2 class="detail-title">Visual Inspiration</h2>
                            <p class="detail-desc" style="color:#999; font-style:italic;">No detailed analysis provided for this item yet.</p>`;
        }
        if (itemData.tags && itemData.tags.length > 0) {
            contentHTML += `<div class="detail-tags-title">Style Keywords</div><div class="detail-tags">`;
            itemData.tags.forEach(t => contentHTML += `<span># ${t}</span>`);
            contentHTML += `</div>`;
        }
        lightboxText.innerHTML = contentHTML;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    // 关闭弹窗
    document.getElementById('closeLightbox').onclick = () => {
        lightbox.classList.remove('active');
        const mediaBox = document.querySelector('.lightbox-image-box');
        mediaBox.innerHTML = `<img src="" alt="View" id="lightboxImg">`;
        lightboxImg.src = '';
        document.body.style.overflow = 'auto';
    }

    // 页面初始化加载
    renderTags();
    renderGrid();
</script>
</body>
</html>
